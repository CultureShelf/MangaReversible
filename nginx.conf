server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Routes Angular (/series/:id...) : renvoyer index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers avec hash dans le nom : cache long
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
